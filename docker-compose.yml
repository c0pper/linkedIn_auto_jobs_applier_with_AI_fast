version: '3.8'

services:
  chrome:
    image: selenium/standalone-chrome:4.33.0-20250606
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "5900:5900"
    volumes:
      - /dev/shm:/dev/shm

  linkedin-bot:
    build: .
    depends_on:
      - chrome
    ports:
      - "8054:8054"  # FastAPI port
      - "7860:7860"  # Gradio UI port
    volumes:
      - ./data_folder:/app/data_folder  # Persist data
    environment:
      - DATA_FOLDER=/app/data_folder
      - SELENIUM_REMOTE_URL=http://chrome:4444
    restart: unless-stopped